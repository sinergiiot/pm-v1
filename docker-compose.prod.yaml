services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: filament_app
        restart: unless-stopped
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
        volumes:
            - .env:/var/www/html/.env
            - storage_data:/var/www/html/storage
        ports:
            - '8080:80'
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - filament_network

    mysql:
        image: 'mysql:8.0'
        container_name: filament_mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - filament_network

    redis:
        image: 'redis:alpine'
        container_name: filament_redis
        restart: unless-stopped
        networks:
            - filament_network

networks:
    filament_network:
        driver: bridge

volumes:
    mysql_data:
    storage_data:
