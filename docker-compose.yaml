services:
    mysql:
        image: 'mysql:8.0'
        container_name: vzl_mysql
        restart: unless-stopped
        ports:
            - '3306:3306'
        environment:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: vzl_project_management
            MYSQL_USER: vzl_user
            MYSQL_PASSWORD: vzl_password
        volumes:
            - 'mysql_data:/var/lib/mysql'
        command: '--default-authentication-plugin=mysql_native_password'
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-h'
                - localhost
            interval: 5s
            timeout: 5s
            retries: 5
volumes:
    mysql_data: null
    sail-mysql:
        driver: local
